services:
  api:
    build: .
    ports:
      - "4110:4110"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 4110
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/splitbill
      SPRING_DATASOURCE_USERNAME: splitbill
      SPRING_DATASOURCE_PASSWORD: splitbill

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: splitbill
      MYSQL_USER: splitbill
      MYSQL_PASSWORD: splitbill
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
 
