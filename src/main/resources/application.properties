spring.application.name=splitbill

# Read local overrides from .env (gitignored). No effect if the file is absent.
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/splitbill}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:splitbill}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:splitbill}

spring.jpa.hibernate.ddl-auto=update

server.servlet.context-path=/api